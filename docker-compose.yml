name: ag8te

services:
  db:
    container_name: ag8te-db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ag8te}
      POSTGRES_USER: ${POSTGRES_USER:-ag8te}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ag8te} -d ${POSTGRES_DB:-ag8te}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: ag8te-app
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000" # Internal only — nginx proxies this
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-ag8te}:${DB_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-ag8te}
      POSTGRES_USER: ${POSTGRES_USER:-ag8te}
      POSTGRES_DB: ${POSTGRES_DB:-ag8te}
      # Flask
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      # Gunicorn
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      # Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@ag8te.com}
      # External services
      FRONTEND_URL: ${FRONTEND_URL:-https://ag8te.com}
      BACKEND_URL: ${BACKEND_URL:-https://ag8te.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-${VITE_GOOGLE_CLIENT_ID:-}}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-${PAYPAL_SECRET:-}}
      PAYPAL_MODE: ${PAYPAL_MODE:-live}
      PAYPAL_API_URL: ${PAYPAL_API_URL:-https://api-m.paypal.com}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-${PAYPAL_CLIENT_SECRET:-}}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-${PAYPAL_API_URL:-https://api-m.paypal.com}}
      YOCO_SECRET_KEY: ${YOCO_SECRET_KEY:-}
      SHIPLOGIC_ENABLED: ${SHIPLOGIC_ENABLED:-0}
      SHIPLOGIC_API_KEY: ${SHIPLOGIC_API_KEY:-}
      SHIPLOGIC_API_URL: ${SHIPLOGIC_API_URL:-https://api.shiplogic.com}
      SHIPLOGIC_COLLECTION_COMPANY: ${SHIPLOGIC_COLLECTION_COMPANY:-}
      SHIPLOGIC_COLLECTION_NAME: ${SHIPLOGIC_COLLECTION_NAME:-}
      SHIPLOGIC_COLLECTION_PHONE: ${SHIPLOGIC_COLLECTION_PHONE:-}
      SHIPLOGIC_COLLECTION_EMAIL: ${SHIPLOGIC_COLLECTION_EMAIL:-}
      SHIPLOGIC_COLLECTION_STREET_ADDRESS: ${SHIPLOGIC_COLLECTION_STREET_ADDRESS:-}
      SHIPLOGIC_COLLECTION_LOCAL_AREA: ${SHIPLOGIC_COLLECTION_LOCAL_AREA:-}
      SHIPLOGIC_COLLECTION_CITY: ${SHIPLOGIC_COLLECTION_CITY:-}
      SHIPLOGIC_COLLECTION_ZONE: ${SHIPLOGIC_COLLECTION_ZONE:-}
      SHIPLOGIC_COLLECTION_CODE: ${SHIPLOGIC_COLLECTION_CODE:-}
      SHIPLOGIC_COLLECTION_COUNTRY: ${SHIPLOGIC_COLLECTION_COUNTRY:-ZA}
      SHIPLOGIC_DEFAULT_PARCEL_DESCRIPTION: ${SHIPLOGIC_DEFAULT_PARCEL_DESCRIPTION:-General goods}
      SHIPLOGIC_DEFAULT_WEIGHT_KG: ${SHIPLOGIC_DEFAULT_WEIGHT_KG:-1.0}
      SHIPLOGIC_DEFAULT_LENGTH_CM: ${SHIPLOGIC_DEFAULT_LENGTH_CM:-30.0}
      SHIPLOGIC_DEFAULT_WIDTH_CM: ${SHIPLOGIC_DEFAULT_WIDTH_CM:-25.0}
      SHIPLOGIC_DEFAULT_HEIGHT_CM: ${SHIPLOGIC_DEFAULT_HEIGHT_CM:-20.0}
      SHIPLOGIC_MAX_WEIGHT_PER_PARCEL_KG: ${SHIPLOGIC_MAX_WEIGHT_PER_PARCEL_KG:-25.0}
      SHIPLOGIC_SHIPPING_MARKUP_TYPE: ${SHIPLOGIC_SHIPPING_MARKUP_TYPE:-flat}
      SHIPLOGIC_SHIPPING_MARKUP_VALUE: ${SHIPLOGIC_SHIPPING_MARKUP_VALUE:-0.0}
      SHIPLOGIC_AUTOMATIC_SHIPMENT_CREATION: ${SHIPLOGIC_AUTOMATIC_SHIPMENT_CREATION:-1}
      HUAWEI_REVIEW_EMAIL: ${HUAWEI_REVIEW_EMAIL:-}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./static:/app/static
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh

  frontend:
    container_name: ag8te-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://ag8te.com}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    expose:
      - "8080"          # Internal only — nginx proxies this
    environment:
      # We now route /api/ through Nginx on port 80, so no port is needed.
      - VITE_API_URL=${VITE_API_URL:-https://ag8te.com}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    depends_on:
      - app

  nginx:
    container_name: ag8te-nginx
    image: nginx:alpine
    entrypoint: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "80:80"       # Frontend (Vite) — main entry point
      - "443:443"     # HTTPS
      - "5006:5006"   # Backend API (Flask)
    volumes:
      - ${NGINX_CONF:-./nginx_dir/new/nginx.docker.conf}:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - ./uploads:/app/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:

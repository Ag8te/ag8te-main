# Local Development Override
# This file is AUTOMATICALLY loaded by Docker Compose when running locally.
# It makes the local environment "just work" without changing the production config.

services:
  app:
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
    volumes:
      # Mount source code for hot-reloading
      - .:/app
      - ./static:/app/static
      - ./uploads:/app/uploads
    # Override to use Flask development server with reload
    command: flask run --host=0.0.0.0 --port=5000 --reload

  nginx:
    volumes:
      - ./nginx_dir/new/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - ./uploads:/app/uploads:ro
    # Skip the /etc/letsencrypt mount which doesn't exist locally

  frontend:
    image: node:20-alpine        # ← use Node.js image, not the built Nginx image
    working_dir: /app            # ← all commands run from /app
    volumes:
      - ./frontend:/app          # ← mount source code for hot reload
      - /app/node_modules        # ← keep container node_modules separate from Windows
    command: sh -c "npm install --prefer-offline --no-audit && npm run dev -- --host 0.0.0.0 --port 8080"
    environment:
      - VITE_API_URL=http://localhost   # ← API calls go to local backend
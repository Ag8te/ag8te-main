server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /sitemap.xml {
        try_files $uri =404;
        default_type application/xml;
    }

    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* \.apk$ {
        return 410;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Public SEO routes have generated route/index.html entry points.
        # Other client-side routes fall back to the SPA shell.
        try_files $uri/index.html $uri /index.html;
    }
}

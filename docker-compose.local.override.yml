# Local Development Override
# Use with: docker compose -f docker-compose.yml -f docker-compose.local.override.yml up
# Keep this file out of the default docker-compose.override.yml name so production does not load it automatically.

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  app:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
    volumes:
      # Mount source code for hot-reloading
      - .:/app
      - ./static:/app/static
      - ./uploads:/app/uploads
    # Override to use Flask development server with reload
    command: flask run --host=0.0.0.0 --port=5000 --reload

  nginx:
    ports: !override
      - "80:80"
      - "5006:5006"
    volumes: !override
      - ./nginx_dir/new/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - ./uploads:/app/uploads:ro
    # Do not inherit the production TLS port or /etc/letsencrypt mount.

  frontend:
    build:
      target: build
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8080"

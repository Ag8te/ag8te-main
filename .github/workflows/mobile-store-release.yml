name: Mobile Store Testing Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional TestFlight release-note override
        required: false
        type: string

concurrency:
  group: mobile-store-testing-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-version:
    name: Resolve tracked version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and resolve store version
        id: version
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "Mobile store testing releases must run from main." >&2
            exit 1
          fi
          python3 scripts/mobile_version.py check
          python3 scripts/mobile_version.py resolve --run-number "${{ github.run_number }}"

  android-stores:
    name: Google Play and Huawei
    needs: prepare-version
    runs-on: ubuntu-latest
    environment: mobile-testing
    env:
      APP_VERSION_NAME: ${{ needs.prepare-version.outputs.version_name }}
      APP_VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
      VITE_API_URL: https://ag8te.com
      VITE_PUBLIC_FRONTEND_URL: https://ag8te.com
      VITE_MOBILE_APP_URL: co.za.ag8te.app://app
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > frontend/android/app/ag8te-release.keystore
          {
            echo "storeFile=ag8te-release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > frontend/android/keystore.properties

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run

      - name: Validate mobile map configuration
        run: |
          test -n "$VITE_GOOGLE_MAPS_API_KEY"
          test -n "$VITE_API_URL"

      - name: Build signed Google Play App Bundle
        working-directory: frontend
        run: npm run android:bundle:release

      - name: Build signed Huawei App Bundle
        working-directory: frontend
        run: npm run huawei:bundle:release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-store-bundles-${{ env.APP_VERSION_CODE }}
          path: |
            frontend/store-builds/google-play/*.aab
            frontend/store-builds/huawei/*.aab
          retention-days: 30

      - name: Upload to Google Play internal testing
        env:
          ANDROID_AAB_PATH: ${{ github.workspace }}/frontend/store-builds/google-play/ag8te-google-play-${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}.aab
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_TRACK: internal
        run: bundle exec fastlane android google_internal

      - name: Upload to Huawei AppGallery
        env:
          ANDROID_AAB_PATH: ${{ github.workspace }}/frontend/store-builds/huawei/ag8te-huawei-${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}.aab
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
          HUAWEI_FEEDBACK_EMAIL: ${{ secrets.HUAWEI_FEEDBACK_EMAIL }}
          HUAWEI_SUBMIT_FOR_REVIEW: "true"
        run: bundle exec fastlane android huawei_testing

  apple-testflight:
    name: Apple TestFlight
    needs: prepare-version
    runs-on: macos-latest
    environment: mobile-testing
    env:
      APP_VERSION_NAME: ${{ needs.prepare-version.outputs.version_name }}
      APP_VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
      VITE_API_URL: https://ag8te.com
      VITE_PUBLIC_FRONTEND_URL: https://ag8te.com
      VITE_MOBILE_APP_URL: co.za.ag8te.app://app
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate mobile map configuration
        run: |
          test -n "$VITE_GOOGLE_MAPS_API_KEY"
          test -n "$VITE_API_URL"

      - name: Install Apple signing certificate and profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/mobile-signing.keychain-db"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/ag8te.mobileprovision"

      - name: Create App Store export configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > frontend/ios/App/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>co.za.ag8te.app</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Build signed iOS IPA
        working-directory: frontend
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: npm run ios:archive:release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-ipa-${{ env.APP_VERSION_CODE }}
          path: frontend/store-builds/apple/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        env:
          IOS_IPA_PATH: ${{ github.workspace }}/frontend/store-builds/apple/ag8te-apple-${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}.ipa
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          RELEASE_NOTES_OVERRIDE: ${{ inputs.release_notes }}
        run: |
          if [[ -n "$RELEASE_NOTES_OVERRIDE" ]]; then
            export RELEASE_NOTES="$RELEASE_NOTES_OVERRIDE"
          else
            export RELEASE_NOTES="$(python3 scripts/mobile_version.py notes --version "$APP_VERSION_NAME")"
          fi
          bundle exec fastlane ios testflight

name: AG8TE CI

on:
  push:
    branches: [ main, master, develop, fix/yoco-instantiation ]
  pull_request:
    branches: [ main, master, develop, fix/yoco-instantiation ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        env:
          FLASK_ENV: testing
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONPATH: .
        run: |
          pytest tests/
          
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        working-directory: frontend
        run: npm install
        
      - name: Run tests
        working-directory: frontend
        run: npm test -- --run
        
  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
          
      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install --legacy-peer-deps
        
      - name: Run tests
        working-directory: apps/mobile
        run: npm test

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    upstream flask_app {
        server app:5000;
    }

    upstream vite_frontend {
        server frontend:8080;
    }

    server {
        listen 80;
        server_name mzansiserve.co.za www.mzansiserve.co.za;
        return 301 http://ag8te.com$request_uri;
    }

    server {
        listen 80 default_server;
        server_name ag8te.com www.ag8te.com ag8te.co.za www.ag8te.co.za _;

        location /api/ {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location ^~ /static/ {
            root /app;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location ^~ /uploads/ {
            root /app;
            expires 7d;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://vite_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
